# 推送到 main 后自动部署到 GitHub Pages。
# 部署前把 HTML 里的 ?v=dev 换成本次提交的 ID：拿到新 HTML 的访客一定加载配套的新 CSS / JS / 图片。
# 注意：HTML 本身仍会被 GitHub Pages 缓存最多 10 分钟（max-age=600，无法修改）；推送后刷新一下页面即可。
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # 不中断正在进行的部署

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Stamp asset versions
        run: |
          V="${GITHUB_SHA::7}"
          sed -i "s/?v=dev/?v=${V}/g" *.html
          grep -o '?v=[0-9a-f]*' index.html | sort -u

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v5
