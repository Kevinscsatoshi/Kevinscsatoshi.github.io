# 推送到 main 后自动部署到 GitHub Pages。
# 构建（tools/build.mjs）：生成相册、sitemap，并把 HTML 里的 ?v=dev 换成本次提交的 ID，
# 拿到新 HTML 的访客一定加载配套的新 CSS / JS / 图片。
# 注意：HTML 本身仍会被 GitHub Pages 缓存最多 10 分钟（max-age=600，无法修改）；推送后刷新一下页面即可。
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # 不中断正在进行的部署

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # sharp：把 photos/ 里的照片自动旋转、缩成网页用的尺寸，并去掉 EXIF / GPS
      - name: Install image tools
        run: npm install --no-save --no-package-lock sharp@0.35

      # 生成相册（albums.js）、sitemap.xml，并给 CSS / JS / 图片加版本号，输出到 _site
      - name: Build site
        run: node tools/build.mjs --out _site --resize

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
