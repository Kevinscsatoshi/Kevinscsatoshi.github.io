<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- 静态默认值（English）：链接预览与爬虫读取这里；JS 会按语言替换 -->
  <title>Travel &amp; Photo — Kevin Sicong Gu</title>
  <meta name="description" content="Kevin Sicong Gu's flights, travels and photo albums." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Travel &amp; Photo — Kevin Sicong Gu" />
  <meta property="og:description" content="Kevin Sicong Gu's flights, travels and photo albums." />
  <meta property="og:image" content="https://kevinscsatoshi.github.io/assets/portrait.png" />
  <link rel="alternate" hreflang="en" href="https://kevinscsatoshi.github.io/photography.html" />
  <link rel="alternate" hreflang="zh-CN" href="https://kevinscsatoshi.github.io/photography.html?lang=zh" />
  <link rel="alternate" hreflang="ja" href="https://kevinscsatoshi.github.io/photography.html?lang=ja" />
  <link rel="alternate" hreflang="x-default" href="https://kevinscsatoshi.github.io/photography.html" />
  <meta property="og:url" content="https://kevinscsatoshi.github.io/photography.html" />
  <meta name="twitter:card" content="summary" />
  <meta name="theme-color" content="#141414" />
  <link rel="icon" href="favicon.svg?v=dev" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+JP:wght@400;500&family=Noto+Serif+SC:wght@400;500&display=swap" rel="stylesheet" />
  <script>document.documentElement.classList.add("js");setTimeout(function(){document.documentElement.classList.add("ready")},2000)</script>
  <link rel="stylesheet" href="style.css?v=dev" />
</head>
<body data-page="photography" class="dark">
  <div class="grain" aria-hidden="true"></div>
  <div class="spotlight" aria-hidden="true"></div>

  <!-- 顶栏、页脚由 main.js 生成（所有页面共用） -->
  <header class="nav" id="site-nav"></header>

  <main class="page">
    <header class="page-head reveal">
      <h1 class="page-title"><span data-i18n="pages.photography.title">Travel &amp; Photo</span> <span class="alt" lang="en" data-i18n="pages.photography.alt"></span></h1>
      <p class="page-intro" data-i18n="pages.photography.intro"></p>
    </header>
    <!-- 飞行地球（globe.js）：数据来自 Flighty 导出（flights.js） -->
    <section class="travel reveal" id="travel" aria-label="Flights">
      <p class="travel-headline" id="travel-headline"></p>
      <div class="travel-tabs mono" id="travel-tabs" role="tablist"></div>
      <div class="globe-wrap">
        <canvas id="globe" aria-hidden="true"></canvas>
        <div class="globe-tip mono" id="globe-tip" hidden></div>
        <p class="globe-hint mono" data-i18n="travel.hint"></p>
      </div>
      <!-- 人生至今的旅行：出生到今天，每年一列，每个点 = 一次航班 -->
      <div class="life" id="life">
        <p class="life-title mono" data-i18n="travel.life"></p>
        <div class="life-chart" id="life-chart"></div>
      </div>
      <dl class="travel-stats" id="travel-stats"></dl>
      <p class="travel-note mono" id="travel-note"></p>
    </section>

    <div id="albums"></div>
  </main>

  <footer class="footer dark" id="site-footer"></footer>

  <!-- 大图浏览：← → 键、左右滑动、按钮切换；Esc 或点空白处关闭 -->
  <div class="lightbox dark" id="lightbox" aria-hidden="true" role="dialog" aria-modal="true">
    <button class="lb-close mono" type="button" data-i18n="lightbox.close">Close ✕</button>
    <button class="lb-nav lb-prev" type="button" data-i18n-aria="lightbox.prev" aria-label="Previous">←</button>
    <figure class="lb-stage"><img alt="" /></figure>
    <button class="lb-nav lb-next" type="button" data-i18n-aria="lightbox.next" aria-label="Next">→</button>
    <p class="lb-cap mono"></p>
    <a class="lb-loc mono" target="_blank" rel="noopener" hidden></a>
  </div>

  <script src="i18n.js?v=dev"></script>
  <script src="content.js?v=dev"></script>
  <script src="albums.js?v=dev"></script>
  <script src="flights.js?v=dev"></script>
  <script src="assets/globe-land.js?v=dev"></script>
  <script src="globe.js?v=dev"></script>
  <script src="main.js?v=dev"></script>
</body>
</html>
