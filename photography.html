<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- 静态默认值（English）：链接预览与爬虫读取这里；JS 会按语言替换 -->
  <title>Photo &amp; Travel — Kevin Sicong Gu</title>
  <meta name="description" content="Photography and travel by Kevin Sicong Gu." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Photo &amp; Travel — Kevin Sicong Gu" />
  <meta property="og:description" content="Photography and travel by Kevin Sicong Gu." />
  <meta property="og:image" content="assets/portrait.png" />
  <meta name="theme-color" content="#141414" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+JP:wght@400;500&family=Noto+Serif+SC:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="photography" class="dark">
  <div class="grain" aria-hidden="true"></div>
  <div class="spotlight" aria-hidden="true"></div>

  <!-- 顶栏、页脚由 main.js 生成（所有页面共用） -->
  <header class="nav" id="site-nav"></header>

  <main class="page">
    <header class="page-head reveal">
      <h1 class="page-title"><span data-i18n="pages.photography.title"></span><span class="alt" lang="en" data-i18n="pages.photography.alt"></span></h1>
      <p class="page-intro" data-i18n="pages.photography.intro"></p>
    </header>
    <div class="filters mono reveal" id="filters"></div>
    <div class="trips" id="trips"></div>
  </main>

  <footer class="footer dark" id="site-footer"></footer>

  <!-- Lightbox -->
  <div class="lightbox dark" id="lightbox" aria-hidden="true">
    <button class="lb-close mono" type="button" data-i18n="lightbox.close"></button>
    <img alt="" />
    <p class="lb-cap mono"></p>
  </div>

  <script src="i18n.js"></script>
  <script src="content.js"></script>
  <script src="main.js"></script>
</body>
</html>
