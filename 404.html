<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- GitHub Pages 在任意路径显示本页，base 保证样式和链接从网站根目录加载 -->
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- 静态默认值（English）：链接预览与爬虫读取这里；JS 会按语言替换 -->
  <title>Page not found — Kevin Sicong Gu</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#ece5d7" />
  <link rel="icon" href="favicon.svg?v=dev" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+JP:wght@400;500&family=Noto+Serif+SC:wght@400;500&display=swap" rel="stylesheet" />
  <script>document.documentElement.classList.add("js");setTimeout(function(){document.documentElement.classList.add("ready")},2000)</script>
  <link rel="stylesheet" href="style.css?v=dev" />
</head>
<body data-page="404">
  <div class="grain" aria-hidden="true"></div>
  <div class="spotlight" aria-hidden="true"></div>

  <header class="nav" id="site-nav"></header>

  <main class="page">
    <header class="page-head reveal">
      <p class="mono muted">404</p>
      <h1 class="page-title" data-i18n="notFound.title">Page not found</h1>
      <p class="page-intro" data-i18n="notFound.text">This page doesn't exist or has moved.</p>
      <div class="links mono"><a href="./" data-i18n="notFound.home">Back to home</a></div>
    </header>
  </main>

  <footer class="footer dark" id="site-footer"></footer>

  <script src="i18n.js?v=dev"></script>
  <script src="content.js?v=dev"></script>
  <script src="main.js?v=dev"></script>
</body>
</html>
